# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock config for 2k monitor resolutions
# Original config submitted by https://github.com/SherLock707
#
# Grace period is a CLI flag now, not a config option:
#   hyprlock --grace 1

# Colors (previously from wallust; change these to taste)
$text = rgba(255, 255, 255, 0.9)
$text_alt = rgba(205, 214, 244, 0.8)
$accent = rgba(137, 180, 250, 1.0)

general {
    fractional_scaling = 1
    immediate_render = true   # draw `color` until the wallpaper has loaded
}

# ---------------------------------------------------------------------------
# Background
# ---------------------------------------------------------------------------
background {
    monitor =
    # Use only one path, or `path = screenshot` for a desktop screenshot
    path = $HOME/Pictures/wallpaper0.jpg
    color = rgb(0, 0, 0)

    # Blur options, see https://wiki.hyprland.org/Configuring/Variables/#blur
    blur_size = 3
    blur_passes = 2   # 0 disables blurring
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# ---------------------------------------------------------------------------
# Clock
# ---------------------------------------------------------------------------

# Hours (use %I instead of %H for 12-hour format)
label {
    monitor =
    text = cmd[update:5000] date +%H
    color = $text
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -50
    halign = center
    valign = top
}

# Minutes
label {
    monitor =
    text = cmd[update:5000] date +%M
    color = $text_alt
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -250
    halign = center
    valign = top
}

# Date (below the clock, refreshed every minute so it rolls over at midnight)
label {
    monitor =
    text = cmd[update:60000] echo "<b> $(date +'%A, %-d %B') </b>"
    color = $text
    font_size = 24
    font_family = Victor Mono Bold Italic
    position = 0, -440
    halign = center
    valign = top
}

# ---------------------------------------------------------------------------
# User
# ---------------------------------------------------------------------------

# Avatar (must be a square image to render as a circle). To make one:
#   magick ~/Pictures/wallpaper0.jpg -gravity center -crop 1:1 +repage -resize 512x512 ~/.face
image {
    monitor =
    path = $HOME/.face
    size = 120
    rounding = -1
    border_size = 2
    border_color = $accent
    position = 0, -80
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text =   $USER
    color = $text
    font_size = 24
    font_family = Victor Mono Bold Oblique
    position = 0, -180
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# Password input
# ---------------------------------------------------------------------------
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    dots_size = 0.4      # 0.2 - 0.8, relative to field height
    dots_spacing = 0.4   # 0.0 - 1.0, relative to dot size
    dots_center = true
    outer_color = $accent
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $text
    capslock_color = rgb(255, 255, 255)
    fade_on_empty = true
    font_family = Victor Mono Bold Oblique
    placeholder_text = <i><span foreground="##ffffff99">🔒 Type Password</span></i>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# Info
# ---------------------------------------------------------------------------

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> $(uptime -p) </b>"
    color = $text
    font_size = 18
    font_family = Victor Mono Bold Oblique
    position = -10, 10
    halign = right
    valign = bottom
}

# Weather (reads the cache written by ~/.config/hypr/UserScripts/Weather.sh/.py)
# See https://github.com/JaKooLit/Hyprland-Dots/wiki/TIPS
label {
    monitor =
    text = cmd[update:3600000] cat "$HOME/.cache/.weather_cache" 2>/dev/null
    color = $text
    font_size = 18
    font_family = Victor Mono Bold Oblique
    position = 50, 0
    halign = left
    valign = bottom
}
